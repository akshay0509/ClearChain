        Rule: "OR('BankBOrgMSP.admin', 'BankBOrgMSP.peer', 'BankBOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('BankBOrgMSP.admin', 'BankBOrgMSP.client','BankBOrgMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('BankBOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('BankBOrgMSP.peer')"
  - &Aggregator
    Name: AggregatorOrgMSP
    ID: AggregatorOrgMSP
    MSPDir: ../organizations/peerOrganizations/aggregator.clearchain.com/msp
    Policies:
      Readers:
        Type: Signature
