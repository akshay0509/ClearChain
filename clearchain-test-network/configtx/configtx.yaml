        Rule: "OR('BankAOrgMSP.admin', 'BankAOrgMSP.peer', 'BankAOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('BankAOrgMSP.admin', 'BankAOrgMSP.client','BankAOrgMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('BankAOrgMSP.admin')"
      Endorsement:
