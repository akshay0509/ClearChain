      Readers:
        Type: Signature
        Rule: "OR('NPCIOrgMSP.admin', 'NPCIOrgMSP.peer', 'NPCIOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('NPCIOrgMSP.admin', 'NPCIOrgMSP.client','NPCIOrgMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('NPCIOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('NPCIOrgMSP.peer')"
  - &BankA
