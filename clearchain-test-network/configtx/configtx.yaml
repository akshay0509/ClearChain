---
################################################################################
#
#   Section: Organizations
#
#   - This section defines the different organizational identities which will
#   be referenced later in the configuration.
#
################################################################################
Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: ../organizations/ordererOrganizations/clearchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer.clearchain.com:7050
  - &Switch
    Name: SwitchOrgMSP
    ID: SwitchOrgMSP
    MSPDir: ../organizations/peerOrganizations/switch.clearchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('SwitchOrgMSP.admin', 'SwitchOrgMSP.peer', 'SwitchOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('SwitchOrgMSP.admin', 'SwitchOrgMSP.client','SwitchOrgMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('SwitchOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('SwitchOrgMSP.peer')"
  - &NPCI
    Name: NPCIOrgMSP
    ID: NPCIOrgMSP
    MSPDir: ../organizations/peerOrganizations/npci.clearchain.com/msp
