# One YugabyteDB (state database) and one KeyDB (transient store) per org.
# Drunix creates a table per chaincode in the state database, so two orgs must
# never share one: their committing peers would collide creating the same table.
# YugabyteDB SQL is published on host ports 5433 (switch) to 5440 (investigator).
networks:
  test:
    name: drunix_test
services:
  yugabyte.switch.clearchain.com:
    container_name: yugabyte.switch.clearchain.com
    image: yugabytedb/yugabyte:2025.2.0.0-b131
    command: ["bin/yugabyted", "start", "--background=false"]
    labels:
      service: drunix
    ports:
      - "5433:5433"
    networks:
      - test

  hlf_keydb_SwitchOrgMSP:
    image: eqalpha/keydb
    container_name: hlf_keydb_SwitchOrgMSP
    command: ["keydb-server", "/etc/keydb/keydb.conf"]
    labels:
      service: drunix
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "6479:6379"
    networks:
      - test

  yugabyte.npci.clearchain.com:
    container_name: yugabyte.npci.clearchain.com
    image: yugabytedb/yugabyte:2025.2.0.0-b131
