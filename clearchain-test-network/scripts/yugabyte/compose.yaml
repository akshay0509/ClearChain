networks:
  test:
    name: drunix_test
services:
  yugabyte.clearchain.com:
    container_name: yugabyte.clearchain.com
    image: yugabytedb/yugabyte:2025.2.0.0-b131
    command: ["bin/yugabyted", "start", "--background=false"]
    ports:
      - "5433:5433"
    networks:
      - test

  hlf_keydb_SwitchOrgMSP:
    image: eqalpha/keydb
    container_name: hlf_keydb_SwitchOrgMSP
    command: ["keydb-server", "/etc/keydb/keydb.conf"]
    labels:
      service: drunix
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "6479:6379"
    networks:
      - test
   
  hlf_keydb_NPCIOrgMSP:
