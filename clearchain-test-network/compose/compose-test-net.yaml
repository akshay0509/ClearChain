      - CORE_PEER_COMMITTINGPEER_TLSCERTPATH=/etc/hyperledger/fabric/cp/tls/ca.crt
      - CORE_PEER_COMMITTINGPEER_FORWARDCOMMITSTATUSREQUESTS_ENABLED=true

    volumes:
      - ../organizations/peerOrganizations/switch.clearchain.com/peers/peer0.switch.clearchain.com:/etc/hyperledger/fabric
      - peer0.switch.clearchain.com:/var/hyperledger/production
