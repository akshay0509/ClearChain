      # - ../organizations/peerOrganizations/switch.clearchain.com/peers/peer4.switch.clearchain.com/tls:/etc/hyperledger/fabric/cp/tls
      - ../organizations/peerOrganizations/switch.clearchain.com/peers/peer1.switch.clearchain.com/tls:/etc/hyperledger/fabric/cp/tls

    ports:
      - 7051:7051
      - 9444:9444

